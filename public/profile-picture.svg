<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="suit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#f8fafc" />
  <g transform="scale(4)">
    <!-- Navy Blazer -->
    <path d="M 14 100 L 28 66 L 50 78 L 72 66 L 86 100 Z" fill="url(#suit-grad)" />
    <path d="M 28 66 L 40 76 L 26 100 Z" fill="#0f172a" />
    <path d="M 72 66 L 60 76 L 74 100 Z" fill="#0f172a" />
    
    <!-- White Shirt -->
    <polygon points="38,66 62,66 50,88" fill="#ffffff" />
    <polygon points="34,66 42,75 47,66" fill="#e2e8f0" />
    <polygon points="66,66 58,75 53,66" fill="#e2e8f0" />
    
    <!-- Navy Tie with Golden Floral Motifs -->
    <polygon points="47,70 53,70 55,96 50,100 45,96" fill="#1e3a8a" />
    <circle cx="50" cy="78" r="1.3" fill="#f59e0b" />
    <circle cx="50" cy="86" r="1.3" fill="#f59e0b" />
    <circle cx="50" cy="94" r="1.1" fill="#f59e0b" />

    <!-- Neck -->
    <rect x="43" y="56" width="14" height="14" rx="2" fill="#e0a98b" />

    <!-- Head -->
    <ellipse cx="50" cy="44" rx="20" ry="23" fill="#f3be9e" />

    <!-- Hair -->
    <path d="M 26 40 C 26 21, 40 15, 50 15 C 60 15, 74 21, 74 40 C 74 32, 70 20, 50 20 C 30 20, 26 32, 26 40 Z" fill="#18181b" />
    <path d="M 27 33 Q 40 14 60 20 Q 75 24 74 36 Q 67 20 48 22 Z" fill="#27272a" />

    <!-- Ears -->
    <ellipse cx="29" cy="46" rx="3" ry="5" fill="#e0a98b" />
    <ellipse cx="71" cy="46" rx="3" ry="5" fill="#e0a98b" />

    <!-- Beard & Mustache -->
    <path d="M 37 54 Q 50 58 63 54 Q 61 66 50 66 Q 39 66 37 54 Z" fill="#27272a" opacity="0.9" />
    <path d="M 41 53 Q 50 56 59 53 Q 50 54 41 53 Z" fill="#18181b" />

    <!-- Smile -->
    <path d="M 42 54 Q 50 63 58 54 Z" fill="#ffffff" stroke="#881337" stroke-width="0.5" />

    <!-- Sunglasses -->
    <rect x="33" y="36" width="14" height="11" rx="3" fill="#3b0764" opacity="0.9" stroke="#94a3b8" stroke-width="1.2" />
    <rect x="53" y="36" width="14" height="11" rx="3" fill="#3b0764" opacity="0.9" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="47" y1="39" x2="53" y2="39" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="35" y1="38" x2="43" y2="45" stroke="#ffffff" stroke-width="1" opacity="0.7" />
    <line x1="55" y1="38" x2="63" y2="45" stroke="#ffffff" stroke-width="1" opacity="0.7" />
  </g>
</svg>